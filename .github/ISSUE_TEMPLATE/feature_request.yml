name: Feature request
description: Suggest something the extension should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not just the feature. What gets in your way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like the extension to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This should be a toggle in the popup rather than always on.
        - label: I am willing to open a pull request for this.
